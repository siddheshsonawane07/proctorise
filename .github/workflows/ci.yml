name: CI

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next]

permissions:
  contents: read

# A newer push makes an older run on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The app needs both to start; this job never reaches a server.
      VITE_SUPABASE_URL: http://127.0.0.1:55321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (the stack project skips itself without one)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The database rules and the sign-in flow, against a real local Supabase in Docker.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run db:start

      - name: Database tests (pgTAP)
        run: npm run db:test

      - name: Generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts

      - name: Point the build and the tests at the local stack
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL)=')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=stack --project=proctor

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-auth
          path: playwright-report
          retention-days: 7
