name: Maintenance

# Daily: snapshots past retention are deleted, accounts asked to be deleted are deleted, and each
# Supabase project sees activity so the free plan does not pause it (PHASE_8 § 8.4).
# Needs SUPABASE_URL and SUPABASE_SECRET_KEY as secrets on the "staging" and "production"
# environments (Settings → Environments). An environment without them is skipped.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintain:
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.SUPABASE_URL != ''
      - run: node scripts/maintenance.mjs
        if: env.SUPABASE_URL != ''
